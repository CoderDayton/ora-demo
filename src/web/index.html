<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#111116">
<title>Ora</title>
</head>
<body class="no-anim">
<canvas id="orb"></canvas>

<aside id="left">
  <section id="panel" class="glass">
    <div class="top">
      <div class="brand"><span class="logo"></span>Ora</div>
      <button type="button" class="iconbtn" id="collapse" title="hide panel"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15M15 10l-2 2 2 2"/></svg></button>
    </div>
    <button type="button" id="newchat"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New chat</button>
    <div id="chatlist"></div>
    <details id="engine">
      <summary><span id="dot"></span><span id="stext">checking...</span><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></summary>
      <div class="body">
        <select id="model"></select>
        <select id="mmproj" title="multimodal projector (audio / vision)"></select>
        <div class="row">
          <label for="ctx">ctx</label>
          <select id="ctx"><option>8192</option><option selected>16384</option><option>32768</option><option>65536</option></select>
          <label><input type="checkbox" id="think"> reasoning</label>
        </div>
        <div class="row">
          <button type="button" id="start" class="primary">Start</button>
          <button type="button" id="stop" class="danger" disabled>Stop</button>
          <button type="button" id="logbtn">Logs</button>
        </div>
        <div id="logs"></div>
      </div>
    </details>
  </section>
</aside>
<div id="scrim"></div>
<button type="button" id="reopen" class="iconbtn" title="show panel"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 4.5v15M13 10l2 2-2 2"/></svg></button>

<button type="button" id="mshow" class="iconbtn" title="metrics"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg></button>
<section id="metrics" class="glass">
  <div class="head"><span class="label">Metrics</span><button type="button" class="iconbtn" id="mtoggle" title="collapse"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
  <div id="badges"><span class="badge" data-m="audio">audio</span><span class="badge" data-m="vision">vision</span><span class="badge" data-m="video">video</span></div>
  <div class="grid" id="mgrid"></div>
</section>

<div id="hero">
  <div class="kicker">Welcome to Ora</div>
  <h1>How can I assist you?</h1>
  <div id="cards">
    <button type="button" data-prompt="Summarize the document I just uploaded in five bullet points.">Summarize the document I upload<span class="svgrow"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-10.5a.5.5 0 0 1-.5-.5V4a.5.5 0 0 1 .5-.5zM14 3.5V8h4M9.5 13h5M9.5 16.5h5"/></svg></span></button>
    <button type="button" data-prompt="Describe the image I attach, then tell me one thing in it most people would miss.">Look at an image with me<span class="svgrow"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l4.5-4.5 3.5 3.5 2-2L19 17"/></svg></span></button>
    <button type="button" data-prompt="Pick a side on something people argue about and defend it. Be opinionated.">Ask for a real opinion<span class="svgrow"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><path d="M12 3l1.9 5.2L19 10l-5.1 1.8L12 17l-1.9-5.2L5 10l5.1-1.8z"/></svg></span></button>
  </div>
</div>

<div id="stage">
  <div id="statusline"></div>
  <div id="log"></div>
  <div id="composer">
    <div id="opts" class="glass" role="dialog" aria-label="Settings">
      <div class="ohead"><span class="label">Settings</span><button type="button" class="iconbtn" id="optsclose" title="close"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <section>
        <h4>Voice</h4>
        <label>Speak replies <input type="checkbox" id="speak" checked></label>
        <label>Voice <select id="voice"><option>female</option><option>male</option></select></label>
        <label>Wait after you stop <span class="range"><input type="range" id="pause" min="400" max="2000" step="100"><output id="pause-v"></output></span></label>
      </section>
      <section>
        <h4>Model</h4>
        <label>Temperature <span class="range"><input type="range" id="temp" min="0" max="2" step="0.1"><output id="temp-v"></output></span></label>
        <label>Max tokens <input type="number" id="maxtok" min="32" max="8192" step="32" value="1024"></label>
        <textarea id="sys" placeholder="System prompt"></textarea>
      </section>
      <section>
        <h4>Documents</h4>
        <label>PDF page size <select id="pagepx"><option value="1024">1024 px</option><option value="1536">1536 px</option><option value="2048">2048 px</option></select></label>
      </section>
      <button type="button" id="clear">New chat</button>
    </div>
    <div class="inner">
      <div id="docs"></div>
      <div id="attached"></div>
      <textarea id="input" rows="1" placeholder="Ask anything, or tap the mic"></textarea>
      <div class="bar">
        <button type="button" class="tool" id="attach" title="attach image"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><rect x="4" y="4.5" width="16" height="15" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M5 17l4.5-4.5 3.5 3.5 2-2L19 17"/></svg></button>
        <button type="button" class="tool" id="docbtn" title="upload a PDF or text document to this chat"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><path d="M20 11.5l-7.8 7.8a4.5 4.5 0 0 1-6.4-6.4l8.2-8.2a3 3 0 0 1 4.2 4.2l-8.1 8.1a1.5 1.5 0 0 1-2.1-2.1l7.4-7.4"/></svg></button>
        <button type="button" class="tool" id="cog" title="settings"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
        <span class="sp"></span>
        <button type="button" class="tool" id="mic" title="hands-free voice"><svg aria-hidden="true" class="i" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg></button>
        <button type="button" id="send" title="send"><svg aria-hidden="true" class="i sendi" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg><svg aria-hidden="true" class="i stopi" viewBox="0 0 24 24" style="fill:currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
      </div>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>
    <input type="file" id="docfile" multiple hidden accept=".pdf,application/pdf,.txt,.md,.markdown,.csv,.tsv,.json,.log,.xml,.yaml,.yml,.toml,.ini,.html,.css,.js,.ts,.py,.c,.h,.cpp,.rs,.go,.java,text/*">
  </div>
</div>

<script type="module" src="./main.ts"></script>
</body>
</html>
