# Hooks run through lefthook (devDependency; hooks are installed by `npm install`, or run `npx lefthook install`).
pre-commit:
  commands:
    typecheck:
      glob: "*.{ts,html,wgsl,json}"
      run: npm run typecheck
    unit:
      glob: "*.ts"
      run: node --test test/web/persona.test.ts test/web/approval.test.ts test/web/transcript.test.ts test/server/history.test.ts test/web/vad.test.ts test/web/markdown.test.ts test/server/config.test.ts test/scripts/fetch-pdfium.test.ts

pre-push:
  commands:
    test:
      run: npm test
    build:
      run: npm run build
